name: Expo Build

on:
  push:
    branches:
      - uat  # Trigger the build on pushes to the main branch
  pull_request:

jobs:
  build:
    name: Build Expo App
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use the Node.js version supported by Expo

      # Install Yarn or npm dependencies
      - name: Install Dependencies
        run: npm install

      # Authenticate with Expo
      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # Set the EXPO_TOKEN in your repository secrets
        run: npx expo login --non-interactive

      # Build Android App
      - name: Build Android
        run: npx expo export --platform android --output-dir dist

      # Build iOS App (requires Expo managed workflow)
      - name: Build iOS
        run: npx expo export --platform ios --output-dir dist

      # Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: expo-build
          path: dist
